on:
  push:
    branches:
      - master
    paths:
      - 'Rust/Cargo.toml' # The version number must be bumped in order to publish to crates.io

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
name: Publish Rust (crates.io)

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The crate carries its own copy of the WGSL port for its "wgsl" feature flag, since the published crate only includes its own folder
      - name: Copy the WGSL port into the crate
        run: cp WGSL/FastNoiseLite.wgsl Rust/FastNoiseLite.wgsl

      - name: Publish to crates.io
        run: cd Rust && cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
